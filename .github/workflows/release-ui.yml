name: Release @spyglassjs/ui

# Push a tag `ui-v<version>` matching ui/package.json to publish that version to npm.
on:
  push:
    tags: ['ui-v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches package version
        run: |
          version="$(node -p "require('./ui/package.json').version")"
          test "ui-v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != ui/package.json version ${version}"; exit 1; }

      # pnpm (not npm) publishes so publishConfig.exports replaces the dev-only exports map.
      # prepublishOnly builds and tests.
      - name: Publish
        run: pnpm --filter @spyglassjs/ui publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
